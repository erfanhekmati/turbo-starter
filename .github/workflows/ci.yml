name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: turbo
          MYSQL_USER: turbo
          MYSQL_PASSWORD: turbo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://turbo:turbo@127.0.0.1:3306/turbo
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-chars
      OTP_HASH_SECRET: ci-otp-secret-at-least-32-chars
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM: ci@example.com
      SMTP_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:8000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: turbo
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio123
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      TOTP_ENCRYPTION_KEY: ci-totp-encryption-key-32chars!!

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Deploy migrations
        run: pnpm db:migrate:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: API unit tests
        run: pnpm --filter @repo/api test

      - name: API e2e tests
        run: pnpm --filter @repo/api test:e2e
